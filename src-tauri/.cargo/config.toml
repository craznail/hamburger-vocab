# Android NDK cross-compilation linkers for Windows
# Using clang.exe directly (not .cmd wrappers) because Rust on Windows
# cannot properly spawn .cmd batch files as child processes.
# Target architecture is passed via rustflags.

[target.aarch64-linux-android]
linker = "D:\\program\\android\\android-sdk-windows\\ndk\\28.0.12433566\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-C", "link-arg=--target=aarch64-linux-android34"]

[target.armv7-linux-androideabi]
linker = "D:\\program\\android\\android-sdk-windows\\ndk\\28.0.12433566\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-C", "link-arg=--target=armv7a-linux-androideabi34"]

[target.i686-linux-android]
linker = "D:\\program\\android\\android-sdk-windows\\ndk\\28.0.12433566\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-C", "link-arg=--target=i686-linux-android34"]

[target.x86_64-linux-android]
linker = "D:\\program\\android\\android-sdk-windows\\ndk\\28.0.12433566\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-C", "link-arg=--target=x86_64-linux-android34"]