<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>TTS 测试</title></head>
<body style="font-family: sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto;">
  <h1>阿里云 TTS 测试</h1>
  
  <div style="margin-bottom: 1rem;">
    <label>API Key：</label><br>
    <input id="apiKey" type="password" style="width: 100%; padding: 0.5rem;" 
           value="sk-b69a111e6bc440f4b15981dabbb94149">
  </div>
  
  <div style="margin-bottom: 1rem;">
    <label>文字：</label><br>
    <input id="textInput" type="text" value="hello world" style="width: 100%; padding: 0.5rem;">
  </div>
  
  <button id="speakBtn" style="padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer;">
    播放
  </button>
  
  <pre id="log" style="margin-top: 1rem; background: #f5f5f5; padding: 1rem; overflow: auto; max-height: 300px;"></pre>

  <script>
    const DASHSCOPE_API_URL = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation'
    
    document.getElementById('speakBtn').onclick = async () => {
      const apiKey = document.getElementById('apiKey').value
      const text = document.getElementById('textInput').value
      const log = document.getElementById('log')
      log.textContent = '请求中...\n'
      
      try {
        log.textContent += 'POST ' + DASHSCOPE_API_URL + '\n'
        log.textContent += 'Body: ' + JSON.stringify({ model: 'qwen3-tts-flash', input: { text, voice: 'Jennifer', language_type: 'Auto' } }) + '\n\n'
        
        const res = await fetch(DASHSCOPE_API_URL, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'qwen3-tts-flash',
            input: { text, voice: 'Jennifer', language_type: 'Auto' }
          })
        })
        
        log.textContent += 'HTTP ' + res.status + '\n'
        
        const data = await res.json()
        log.textContent += 'Response: ' + JSON.stringify(data, null, 2) + '\n\n'
        
        if (data.output?.audio?.url) {
          log.textContent += '音频 URL: ' + data.output.audio.url + '\n'
          log.textContent += '正在播放...\n'
          const audio = new Audio(data.output.audio.url)
          audio.play()
          log.textContent += '播放中...\n'
        } else {
          log.textContent += '错误: 没有返回音频 URL\n'
        }
      } catch (err) {
        log.textContent += '异常: ' + err.toString() + '\n'
      }
    }
  </script>
</body>
</html>
